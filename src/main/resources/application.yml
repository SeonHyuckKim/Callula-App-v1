spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
    secret: Y2FsbHVsYS1zZXJ2ZXItand0LXNlY3JldC1rZXktMjAyNi0wMi0xMw==
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000

http-client:
    connect-timeout: 10
    read-timeout: 30
    write-timeout: 30
    max-idle-connections: 5
    keep-alive-duration: 5
    retry-on-connection-failure: true
    logging-level: BASIC

swagger:
    username: admin
    password: 1234

aws:
    s3:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
        region: ${AWS_S3_REGION}
        bucket-name: ${AWS_S3_BUCKET}


anthropic:
    api-key: ${ANTHROPIC_API_KEY}
